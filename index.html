<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>PITOPA</title>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E7%8E%8B%E7%8E%89%E9%87%91%E9%8A%80%E6%A1%82%E9%A6%99%E8%A7%92%E9%A3%9B%E6%AD%A9%E9%BE%8D%E9%A6%AC%E5%85%A8%E5%9C%AD%E6%9D%8F%E3%81%A8&display=swap">
<style>
/* Layout: a lantern-lit mine at night. In play: header, the crew strip with pixel dwarf faces, the night cross-section of the one shaft with its heat
   gauge, then a dark tray with the bag, the radar card and the big 進む／帰る buttons. Home, lobby and results use the same dark panels.
   Deliberately single-theme: it is always night underground. */
:root{
  color-scheme:dark;
  --bg:#15110e; --panel:#221b16; --panel-2:#2b221b; --seam:#3a3029; --ink:#efe4d4; --muted:#b3a493;
  --lamp:#f2a541; --lamp-d:#c47f22; --gold:#f2c84b; --danger:#e0533d; --cool:#6fb1e8; --ok:#7fd19b;
  --f-pix:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
  --f:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --pad-l:max(16px,env(safe-area-inset-left,0px)); --pad-r:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6}
body.page{padding-left:var(--pad-l);padding-right:var(--pad-r);padding-block:20px 36px}
#app{max-width:460px;margin:0 auto}
body.ingame #app{padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
button:disabled{cursor:default}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.pix{font-family:var(--f-pix)}
.cap{font-size:11px;color:var(--muted)}
.muted{color:var(--muted)}
.warn{color:var(--danger)}
.btn{min-height:50px;border-radius:12px;border:0;background:var(--lamp);color:#2a1a08;font-family:var(--f-pix);font-size:18px;padding:0 18px;box-shadow:inset 0 -4px 0 var(--lamp-d)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.soft{background:var(--panel);color:var(--ink);border:1px solid var(--seam);box-shadow:none}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.card{background:var(--panel);border:1px solid var(--seam);border-radius:12px;padding:12px 14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand .name{font-family:var(--f-pix);font-size:30px;color:var(--lamp);line-height:1.1;text-shadow:0 0 18px rgba(242,165,65,.3)}
.brand .name small{display:block;font-family:var(--f);font-size:11px;color:var(--muted);text-shadow:none;letter-spacing:.08em}
.ibtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--seam);background:var(--panel);color:var(--ink);display:grid;place-items:center;flex:none;font-family:var(--f-pix);font-size:17px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero .t{font-family:var(--f-pix);font-size:22px;color:var(--lamp)}
.hero .s{font-size:12px;color:var(--muted)}
.sky{width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--seam);background:#1b2140}
.sky canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.timer{font-family:var(--f-pix);font-size:13px;background:var(--panel);border:1px solid var(--seam);border-radius:8px;padding:2px 12px;font-variant-numeric:tabular-nums}
.member{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--seam)}
.member:last-child{border-bottom:0}
.member .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.sw{width:12px;height:12px;flex:none;display:inline-block}
.face{display:inline-grid;flex:none}
.req{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px dashed var(--lamp);border-radius:10px;padding:8px 10px;margin-top:6px}
.req span{flex:1;min-width:120px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.game{min-height:70px;border-radius:10px;border:1px solid var(--seam);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-pix);font-size:16px}
.game.on{border:2px solid var(--lamp);color:var(--lamp);background:var(--panel-2)}
.game small{font-family:var(--f);font-size:10px;color:var(--muted)}
.game:disabled{opacity:.45}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;min-height:50px;font:inherit;font-family:var(--f-pix);font-size:18px;letter-spacing:.16em;text-transform:uppercase;padding:0 14px;border-radius:10px;border:1px solid var(--seam);background:var(--bg);color:var(--ink)}
.linkbox{font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--seam);border-radius:8px;padding:8px 10px;user-select:all;margin-top:8px}
details summary{cursor:pointer;min-height:26px;font-weight:700}
details[open] summary{margin-bottom:10px}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--seam)}
.rank:last-child{border-bottom:0}
.rank .no{font-family:var(--f-pix);width:20px;color:var(--muted)}
.rank.win .no{color:var(--gold)}
.rank .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rank .ores{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.rank .pt{font-family:var(--f-pix);font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}

/* in game */
.bar{display:flex;align-items:center;gap:8px;padding:0 var(--pad-r) 0 var(--pad-l)}
.bar .ttl{display:flex;flex-direction:column;flex:1;min-width:0}
.bar .ttl b{font-family:var(--f-pix);font-weight:400;font-size:24px;color:var(--lamp);line-height:1.1}
.bar .ttl span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.crew{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;padding:0 var(--pad-r) 0 var(--pad-l)}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:10px;min-width:0;background:var(--panel);border:2px solid var(--seam)}
.chip.me{border-color:var(--lamp)}
.chip.burnt{background:#2a1410;border-color:#5a2418}
.chip .nm{font-size:11px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .sc{font-family:var(--f-pix);font-size:17px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.chip .sub{font-size:10px;color:var(--muted);white-space:nowrap}
.chip .sub.wait{color:var(--danger)}
.chip .sub.ok{color:var(--ok)}
.chip .sub.home{color:var(--cool)}
.board{position:relative;border-top:1px solid var(--seam);border-bottom:1px solid var(--seam);background:#1b2140;overflow:hidden}
.board canvas.view{display:block;width:100%;height:auto;image-rendering:pixelated}
.depthtag{position:absolute;left:var(--pad-l);top:42%;font-family:var(--f-pix);font-size:13px;background:rgba(21,17,14,.85);border:1px solid var(--seam);border-radius:8px;padding:2px 10px;color:var(--lamp)}
.heat{position:absolute;right:calc(var(--pad-r) - 4px);top:18%;bottom:14px;width:12px;border-radius:6px;background:var(--panel);border:1px solid var(--seam);overflow:hidden;display:flex;align-items:flex-end}
.heat i{display:block;width:100%;background:linear-gradient(0deg,var(--danger),var(--lamp));transition:height .4s}
.heatlbl{position:absolute;right:calc(var(--pad-r) + 14px);bottom:12px;background:rgba(21,17,14,.85);border:1px solid var(--danger);color:#ff9a7a;border-radius:8px;padding:2px 8px;font-size:12px}
.jptag{position:absolute;left:var(--pad-l);top:10px;font-family:var(--f-pix);font-size:12px;background:rgba(21,17,14,.85);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:2px 10px}
/* 始まりのふきだし：ゲージを指して「進む？帰る？」。ゲージとボタンが光る */
.dw-tip{position:absolute;right:calc(var(--pad-r) + 20px);top:44%;width:min(62%,250px);background:var(--panel-2);border:2px solid var(--lamp);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:700;line-height:1.45;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;animation:pop .25s ease;z-index:2}
.dw-tip b{display:block;font-family:var(--f-pix);font-weight:400;font-size:18px;color:var(--lamp)}
.dw-tip::after{content:"";position:absolute;right:-8px;top:60%;width:12px;height:12px;background:var(--panel-2);border:2px solid var(--lamp);border-left:0;border-bottom:0;transform:translateY(-50%) rotate(45deg)}
.heat.glow{animation:hglow .8s ease-in-out infinite}
@keyframes hglow{50%{box-shadow:0 0 0 3px rgba(224,83,61,.5),0 0 14px rgba(255,110,40,.7)}}
.btn.choice.glow{animation:cglow 1s ease-in-out infinite}
@keyframes cglow{50%{box-shadow:0 0 0 4px rgba(242,165,65,.35),0 0 18px rgba(242,165,65,.45)}}
.boom.gold{color:#fff6c8;text-shadow:3px 3px 0 #c49a2c,-2px -2px 0 #2a1a08}
.rres.jack{color:var(--gold)}
.boom{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--f-pix);font-size:48px;color:#fff1a8;text-shadow:3px 3px 0 var(--danger),-2px -2px 0 #2a1a08;white-space:nowrap;pointer-events:none;animation:boom .5s ease}
@keyframes boom{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(.4);opacity:0}70%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.15)}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:1}}
.reveal{margin:0 var(--pad-r) 0 var(--pad-l);background:var(--panel);border:2px solid var(--lamp);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:pop .25s ease}
.reveal.hot{border-color:var(--danger);box-shadow:0 0 30px rgba(224,83,61,.25)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.rtitle{font-family:var(--f-pix);font-size:22px;color:var(--lamp);text-align:center}
.rl{display:flex;align-items:center;gap:10px;font-size:14px}
.rl b{font-family:var(--f-pix);font-weight:400;font-size:16px}
.rl b.go{color:var(--lamp)}
.rl b.home{color:var(--cool)}
.rl .res{font-size:12px;min-width:84px;text-align:right}
.rres{text-align:center;font-size:13px;border-top:1px dashed var(--seam);padding-top:8px;margin-top:2px}
.rres.magma{color:#ff9a7a}
.tray{margin:0 var(--pad-r) 0 var(--pad-l);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.bag{display:flex;flex-direction:column;flex:1;min-width:0}
.bag b{font-family:var(--f-pix);font-weight:400;font-size:22px;line-height:1.2;color:var(--gold)}
.bag b.plain{color:var(--ink)}
.radar{text-align:left;background:var(--panel-2);border:2px solid var(--lamp);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;min-width:96px;min-height:50px}
.radar b{font-family:var(--f-pix);font-weight:400;font-size:15px;color:var(--lamp)}
.radar span{font-size:10px;color:var(--muted)}
.radar:disabled{border-color:var(--seam);opacity:.6}
.radar:disabled b{color:var(--muted)}
.radarmsg{background:#12261c;border:2px solid #3fcf8a;color:#9effc8;border-radius:12px;padding:8px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.radarmsg b{font-family:var(--f-pix);font-weight:400;font-size:17px}
.radarmsg.danger{background:#2a1410;border-color:var(--danger);color:#ff9a7a}
.radarmsg .cap{color:inherit;opacity:.75}
.choices{display:grid;gap:10px}
.btn.choice{min-height:64px;font-size:24px}
.btn.choice.picked{outline:3px solid var(--ink);outline-offset:2px}
.btn.choice.dim{opacity:.55}
.btn.choice:disabled{filter:grayscale(1);opacity:.4}
.btn.choice.picked:disabled{filter:none;opacity:.85}
.passto{display:flex;align-items:center;gap:8px;font-size:13px;border:1px dashed var(--lamp);border-radius:10px;padding:6px 12px;color:var(--lamp)}
.note{font-size:12px;color:var(--muted);text-align:center}

/* sheet (radar card) */
.sheet{position:fixed;inset:0;background:rgba(11,9,7,.88);display:flex;align-items:center;justify-content:center;z-index:30;
  padding:calc(16px + env(safe-area-inset-top,0px)) var(--pad-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--pad-l)}
.sheet .inner{width:100%;max-width:340px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;align-items:stretch}
/* 遊びかたのスライド（ホームと同じ白・黒・朱。openSlides） */
.sheet.slides,body.trap .sheet.slides,body.board .sheet.slides{background:rgba(20,20,20,.5)}
.sl{width:100%;max-width:380px;height:min(680px,100%);background:#fff;color:#141414;border-radius:26px;padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none;font-family:inherit}
.sl-top{display:flex;align-items:center;gap:12px;min-height:34px}
.sl-bar{flex:1;display:flex;gap:4px}
.sl-bar i{flex:1;height:3px;border-radius:2px;background:#e6e3dc}
.sl-bar i.on{background:#ff5a36}
.sl-x{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:#f1efea;color:#141414;font-family:inherit;font-weight:900;font-size:16px;cursor:pointer}
.sl-num{font-size:12px;font-weight:900;color:#ff5a36;letter-spacing:.06em;margin-top:6px}
body .sheet .sl:focus,body .sheet .sl:focus-visible{outline:none;box-shadow:none}
/* 見出しは空白のところでだけ改行する（「とっ／たら」のように切れないように） */
.sl-t{display:block;font-size:28px;font-weight:900;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.sl-s{margin:0;font-size:14px;color:#77736a;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.sl-art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#f6f4ef;border-radius:22px;overflow:hidden;margin-top:4px}
.sl-art>img{width:96%;height:100%;object-fit:contain;pointer-events:none}
.sl-fan{position:relative;width:82%;aspect-ratio:4/3}
.sl-fan img{position:absolute;width:44%;left:28%;top:12%;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.2);background:#fff;padding:3px}
.sl-nav{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px}
.sl-nav button{border:0;border-radius:16px;padding:14px;font-family:inherit;font-weight:900;font-size:15px;cursor:pointer;background:#f1efea;color:#141414}
.sl-nav button:disabled{opacity:.4;cursor:default}
.sl-nav button.on{background:#141414;color:#fff;box-shadow:0 4px 0 #ff5a36}
.sl button:focus-visible{outline:3px solid #ff5a36;outline-offset:2px}
.sl-foot{display:grid;gap:6px;font-size:12px}
.sl-foot .card{background:#f6f4ef;border:0;color:#141414}
.sl-foot .cap{color:#77736a}
/* スライドの絵（盤・カードの小さな見本） */
.sla-px{height:100%;width:auto;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.sl-art:has(.sla-px){background:#1b2140}
.sla-col{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.sla-row{display:flex;align-items:center;justify-content:center;gap:14px}
.sla-arr{font-size:22px;font-weight:900;color:#ff5a36}
.sla-rev{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;background:#2c6146;padding:6px;border-radius:12px;width:calc(var(--n) * 46px);max-width:86%}
.sla-rev i{aspect-ratio:1;background:#3b8259;border-radius:6px;display:grid;place-items:center}
.sla-rev b{width:80%;height:80%;border-radius:50%;background:#141414;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sla-rev b.w{background:#fff}
.sla-rev b.n{box-shadow:0 0 0 3px #ff5a36}
.sla-rev i.d::after{content:"";width:26%;height:26%;border-radius:50%;background:rgba(255,255,255,.75)}
.sla-score{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.sla-ch{display:grid;grid-template-columns:repeat(var(--n),1fr);width:calc(var(--n) * 46px);max-width:86%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px #141414}
.sla-ch i{aspect-ratio:1;background:#f1e6d2;display:grid;place-items:center;position:relative}
.sla-ch i.dk{background:#c9ab84}
.sla-ch i.d::after{content:"";width:26%;height:26%;border-radius:50%;background:rgba(20,20,20,.45)}
.sla-ch i.r::after{content:"";position:absolute;inset:8%;border-radius:50%;box-shadow:inset 0 0 0 3px #ff5a36}
.sla-ch i.hot{background:#ff9a80}
.sla-cp{font-size:36px;line-height:1;color:#141414}
.sla-cp.w{color:#fff;-webkit-text-stroke:1.6px #141414;paint-order:stroke fill}
.sla-cp.big{font-size:84px}
.sla-koma{width:58px;height:66px;background:#f0d29a;clip-path:polygon(50% 0,86% 13%,100% 100%,0 100%,14% 13%);display:grid;place-items:center;padding-top:8px;font-weight:900;font-size:28px;color:#141414}
.sla-koma.big{width:84px;height:96px;font-size:40px}
.sla-koma.flip{transform:rotate(180deg)}
.sla-koma.red{color:#d2322a}
.sla-bg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:230px;max-width:88%;background:#fff;padding:8px;border-radius:14px;box-shadow:0 0 0 2px #141414}
.sla-bg b{text-align:center;font-weight:900;font-size:14px;color:#ff5a36}
.sla-bg i{aspect-ratio:1;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px;border-radius:8px;background:#f6f4ef;font-variant-numeric:tabular-nums}
.sla-bg i.h{background:#141414;color:#fff;border-radius:50%}
.sla-bg i.ln{box-shadow:0 0 0 3px #ff5a36}
.sla-bg i:nth-child(18){font-size:9px}
.sla-ball{width:136px;height:136px;border-radius:50%;background:#ff5a36;display:grid;place-items:center;align-content:center;color:#141414;font-weight:900;font-size:52px;line-height:1;box-shadow:inset 0 0 0 22px #ff5a36,inset 0 0 0 200px #fff}
.sla-ball small{font-size:20px;color:#ff5a36}
.sla-btn{background:#ff5a36;color:#fff;font-weight:900;font-size:18px;padding:10px 26px;border-radius:999px;box-shadow:0 4px 0 #141414}
.sla-choice{display:grid;gap:14px;width:70%}
.sla-choice span{border-radius:16px;padding:18px;text-align:center;font-weight:900;font-size:22px;background:#fff;box-shadow:0 0 0 2px #141414}
.sla-choice span.on{background:#141414;color:#fff;box-shadow:0 4px 0 #ff5a36}
.sla-rank{display:grid;gap:8px;width:82%}
.sla-rank div{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;font-weight:900}
.sla-rank div.win{box-shadow:0 0 0 3px #ff5a36}
.sla-rank b{color:#ff5a36}
.sla-rank i{font-style:normal;font-size:14px}
.sla-vs{display:flex;align-items:center;gap:14px}
.sla-vs b{font-size:22px;color:#ff5a36}
.sla-av{min-width:92px;height:92px;border-radius:50%;background:#141414;color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;padding:0 8px}
.sla-av.cpu{background:#fff;color:#141414;box-shadow:0 0 0 2px #141414;font-size:12px}
@media (max-height:740px){.sl{padding:12px 16px 14px;gap:6px}.sl-t{font-size:24px}.sl-nav button{padding:12px}}

.gi-dwarf{background:linear-gradient(160deg,#ffcf6b,#f2a541)}

.hub-foot{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin-top:6px}

/* 部屋主のOKを待つ画面（viewWait）：名前入りの小さな入場券 */

body.trap{margin:0;height:100dvh;overflow:hidden;color:#3a3326;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:#eaf2fb}
body.trap #app{height:100%}
body.trap :focus-visible{outline:3px solid #3f7fe0;outline-offset:2px}
.tp{position:relative;height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--sky3));color:var(--fg);overflow:hidden;
  padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.tp-head{flex:none;display:flex;align-items:flex-start;gap:8px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tp-ttl{flex:1;min-width:0}
.tp-ttl small{display:block;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-ttl b{display:block;font-size:26px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-ttl b.long{font-size:21px}
.tp-ttl b span{font-size:13px;font-weight:700;color:var(--sub);margin-left:6px}
.felt{background:#fffaf0;border-radius:14px;padding:3px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.felt>.st{border:2px dashed #d9c6a2;border-radius:11px}
.tp-ib{width:42px;height:42px;border:0;border-radius:50%;background:#fffaf0;box-shadow:0 2px 0 rgba(0,0,0,.1);display:grid;place-items:center;color:#3a3326;font:inherit;font-weight:900;font-size:16px;padding:0;flex:none}
.tp-ib>i{width:34px;height:34px;border-radius:50%;border:2px dashed #d9c6a2;box-sizing:border-box;display:grid;place-items:center;font-style:normal}
.tp-ib.quit{width:auto;border-radius:21px;padding:0 4px}
.tp-ib.quit>i{width:auto;border-radius:17px;padding:0 10px;font-size:13px}
.tp-seats{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.tp-seat{background:#fffaf0;border-radius:11px;padding:2px;box-shadow:0 2px 0 rgba(0,0,0,.08);min-width:0;transition:transform .2s}
.tp-seat>div{border:2px dashed #e4d6ba;border-radius:9px;padding:3px 5px 2px;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tp-seat .r{font-size:10px;font-weight:900;display:flex;align-items:center;gap:4px;white-space:nowrap;color:#3a3326}
.tp-seat .r i{width:9px;height:9px;border-radius:50%;flex:none}
.tp-seat .n{font-size:11px;font-weight:700;color:#7a6e58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-seat.now{transform:translateY(-2px);box-shadow:0 0 0 3px var(--c),0 4px 0 rgba(0,0,0,.08)}
.tp-seat.me>div{border-color:var(--c)}
.tp-seat.off{opacity:.55}
.tp-tags{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:7px max(14px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tp-tag .st{padding:2px 10px;font-size:12px;font-weight:700;color:#3a3326;white-space:nowrap}
.tp-tag b{font-size:14px}
.tp-tag.hot .st{border-color:#e8a090;color:#c23d2f}
.tp-board{flex:1;min-height:0;position:relative}
.tp-board canvas{position:absolute;inset:0}
.tp-reset{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:6px;z-index:4;border:0;border-radius:999px;background:#fffaf0;box-shadow:0 2px 0 rgba(0,0,0,.12);font:inherit;font-size:12px;font-weight:900;color:#3a3326;padding:7px 12px}
.tp-reset[hidden]{display:none}
.tp-load{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub)}
.tp-die{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:6px;display:flex;gap:6px;pointer-events:none}
.tp-die span{width:44px;height:44px;border-radius:11px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.14),inset 0 0 0 2px #efe4cf;display:grid;place-items:center;font-size:24px;font-weight:900;color:#e04a3a}
.tp-die.spin span{animation:tpspin .6s cubic-bezier(.2,.8,.3,1.2)}
@keyframes tpspin{0%{transform:translateY(-40px) rotate(-200deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.tp-pop{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font-weight:900;white-space:nowrap;animation:tppop 1.6s ease forwards;z-index:3}
.tp-pop span{display:block;background:#fffaf0;border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:16px}
.tp-pop.good span{color:#2f8a3a}.tp-pop.bad span{color:#d0402f;font-size:20px}.tp-pop.poison span{color:#8a4ac0}
@keyframes tppop{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-18px}}
.tp-banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;pointer-events:none;animation:tppop 2.4s ease forwards;white-space:nowrap}
.tp-banner .st{padding:4px 14px;font-size:13px;font-weight:900}
/* 役のお知らせ（スポットライト）：まわりを暗くして、自分の席とコマを照らす */
.tp-spot{position:fixed;inset:0;z-index:20;cursor:pointer;animation:tpspot .35s ease both}
.tp-spot.out{animation:tpspotout .25s ease forwards}
.tp-spot .dim svg{display:block}
.tp-spot .ring{position:absolute;border-radius:50%;border:3px dashed rgba(255,250,240,.92);box-sizing:border-box;animation:tpring 1.6s ease-in-out infinite}
.tp-spot .tip{position:absolute;animation:tptip .4s .15s ease both}
.tp-spot .tip::before{content:"";position:absolute;top:-8px;left:var(--ax);width:18px;height:18px;background:#fffaf0;transform:rotate(45deg)}
.tp-spot .tip .st{position:relative;display:grid;gap:2px;padding:12px 16px 14px;text-align:left}
.tp-spot .tip small{font-size:13px;font-weight:700;color:#8a7e68}
.tp-spot .tip b{font-size:28px;font-weight:900;line-height:1.15;color:var(--rc)}
.tp-spot .tip span{font-size:15px;font-weight:700;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
@keyframes tpspot{from{opacity:0}}
@keyframes tpspotout{to{opacity:0}}
@keyframes tptip{from{opacity:0;transform:translateY(10px)}}
@keyframes tpring{50%{transform:scale(1.08)}}
/* 確認用：URL に ?fps をつけたときだけ、1秒に何回描けているかと画質の段階を出す */
.tp-fps{position:absolute;left:8px;bottom:8px;z-index:5;background:rgba(0,0,0,.62);color:#fff;font:700 11px/1.5 ui-monospace,monospace;padding:2px 7px;border-radius:6px;pointer-events:none;white-space:nowrap}
/* 始まりの動きのあとの札「チュンチュン大作戦」＋朱の「スタート！」 */
.tp-start{position:absolute;left:50%;top:22%;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(-50%);animation:tpstart 1.9s ease forwards}
.tp-start .felt{transform:rotate(-3deg);animation:tpstamp .45s cubic-bezier(.3,1.6,.5,1) both}
.tp-start .st{padding:8px 20px;font-size:24px;font-weight:900;white-space:nowrap;color:#3a3326}
.tp-start b{margin-left:70px;background:#ff5a36;color:#fff;font-size:18px;font-weight:900;padding:6px 18px;border-radius:999px;transform:rotate(4deg);box-shadow:0 3px 0 rgba(0,0,0,.14),inset 0 0 0 3px #ff5a36,inset 0 0 0 5px rgba(255,255,255,.7);animation:tpstamp .45s .3s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tpstamp{from{opacity:0;scale:.3}}
@keyframes tpstart{0%,80%{opacity:1}100%{opacity:0;translate:0 -14px}}
.tp-info{flex:none;display:flex;justify-content:center;padding:4px 14px 0;min-height:42px;box-sizing:border-box}
.tp-info .felt{max-width:100%}
.tp-info .st{padding:5px 12px;font-size:13px;font-weight:700;color:#3a3326;display:flex;align-items:center;gap:8px;line-height:1.35}
.tp-info .st b{font-size:15px}
.tp-info .num{flex:none;width:28px;height:28px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 2px #e8dcc4;display:grid;place-items:center;font-weight:900;font-size:17px;color:#e04a3a}
.tp-hand{flex:none;position:relative;height:172px;margin-top:4px}
.tp-hand.empty{height:40px}
.tp-hand .none{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub)}
.tp-card{position:absolute;top:14px;width:112px;height:156px;border:0;padding:5px;background:#fff;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,.2);transform-origin:50% 110%;transition:transform .18s,top .18s,opacity .2s,filter .2s;font:inherit;text-align:left;color:#3a3326;cursor:pointer}
.tp-card .in{height:100%;background:var(--cc);border-radius:7px;padding:5px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.tp-card .nm{display:flex;align-items:center;justify-content:space-between;padding:0 2px;color:#fff;font-size:13px;font-weight:900;white-space:nowrap}
.tp-card .nm i{width:17px;height:17px;border-radius:50%;background:#fff;color:var(--cc);font-size:10px;font-style:normal;display:grid;place-items:center;flex:none}
.tp-card .art{height:66px;border-radius:5px;background:radial-gradient(circle at 50% 40%,#fff,var(--ab));overflow:hidden;display:grid;place-items:center}
.tp-card .art img{width:100%;height:100%;object-fit:contain;display:block}
.tp-card .ds{flex:1;border-radius:5px;background:#fffaf0;font-size:10.5px;font-weight:700;line-height:1.35;padding:4px 6px;overflow:hidden}
.tp-card.sel{top:-2px;box-shadow:0 0 0 3px #ffd23a,0 10px 18px rgba(0,0,0,.25);z-index:3}
.tp-card.off{filter:saturate(.45) brightness(.97);opacity:.8}
.tp-act{flex:none;display:flex;gap:8px;padding:6px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.tp-btn{flex:1;min-height:52px;border:0;border-radius:26px;background:var(--btn,#3f7fe0);color:#fff;font:inherit;font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);padding:0 10px;line-height:1.2}
.tp-btn small{display:block;font-size:11px;font-weight:700;opacity:.9}
.tp-btn.soft{background:#fffaf0;color:#3a3326}
.tp-btn:disabled{opacity:.55}
.tp-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tp-wait{flex:1;min-height:52px;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--sub);text-align:center}
@media (max-height:720px){.tp-ttl b{font-size:22px}.tp-hand{height:146px}.tp-card{height:132px;width:104px;top:10px}.tp-card .art{height:50px}.tp-card .ds{font-size:10px}.tp-btn{min-height:48px}.tp-seats{padding-top:6px}}
@media (max-height:640px){.tp-tags{display:none}.tp-hand{height:128px}.tp-card{height:118px;width:100px}.tp-card .art{height:40px}}
/* 結果 */
.tp-over{justify-content:flex-start;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.tp-over .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 0 4px}
.tp-over .hero img{width:200px;height:150px;object-fit:contain}
.tp-over .hero small{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.1em}
.tp-over .hero b{font-size:32px;font-weight:900;line-height:1.2}
.tp-over .hero span{font-size:14px;font-weight:700}
.tp-res .st{padding:4px 12px}
.tp-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #eadfc8}
.tp-row:last-child{border-bottom:0}
.tp-row i{width:14px;height:14px;border-radius:50%;flex:none}
.tp-row .w{flex:1;min-width:0;line-height:1.3}
.tp-row .w b{display:block;font-size:14px}
.tp-row .w span{font-size:11px;color:#7a6e58;font-weight:700}
.tp-row .v{font-size:13px;font-weight:900;text-align:right;white-space:nowrap}
.tp-endbtns{display:flex;gap:8px;margin-top:auto}
/* 遊びかたシート */
body.trap .sheet{background:rgba(40,36,30,.55)}
body.trap .sheet .inner{background:#fffaf0;border-radius:20px;padding:16px;color:#3a3326;max-height:calc(100% - 40px)}
body.trap .sheet .btn{background:#3f7fe0;color:#fff;box-shadow:none;font-family:inherit;font-weight:900;border-radius:999px}
body.trap .toast{background:#3a3326;color:#fffaf0;top:auto;bottom:calc(240px + env(safe-area-inset-bottom,0px))}
/* ハブ */
.gi-trap{background:linear-gradient(#cfe9ff,#f4e6c8)}
.gi-trap svg{width:46px;height:46px}
.tk-art img.tp-tk{display:block;width:100%;height:100%;object-fit:contain;background:linear-gradient(#cfeaff,#fff4dc)}
@media (prefers-reduced-motion:reduce){.tp-die.spin span,.tp-pop,.tp-banner,.tp-start .felt,.tp-start b,.tp-spot,.tp-spot .ring,.tp-spot .tip{animation:none}}
/* ===== 盤のゲーム（リバーシ・チェス・将棋）とビンゴ大会（body.board）：ハブと同じ白・黒・朱。見た目は仮 ===== */
body.board{height:100vh;height:100dvh;overflow:hidden;background:#f6f5f2;color:#141414;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad-r) calc(12px + env(safe-area-inset-bottom,0px)) var(--pad-l);
  --h-ink:#141414;--h-mute:#7d7a72;--h-line:#e4e2dc;--h-soft:#e9e7e1;--h-card:#fff;--h-acc:#ff5a36;--h-acc-d:#c23d1f}
body.board :focus-visible{outline:2px solid var(--h-acc);outline-offset:2px}
body.board #app{height:100%}
.bd{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bd>*{flex:none}
.bd-head{display:flex;align-items:center;gap:8px}
.bd-ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.bd-ttl b{font-weight:900;font-size:22px;line-height:1.15}
.bd-ttl small{font-size:11px;color:var(--h-mute);font-variant-numeric:tabular-nums}
/* 席 */
.bd-pl{display:flex;align-items:center;gap:10px;background:var(--h-card);border:1px solid var(--h-line);border-radius:14px;padding:6px 10px;min-height:48px}
.bd-pl.now{border-color:var(--h-ink);box-shadow:inset 0 0 0 1px var(--h-ink)}
.bd-pl .who{display:flex;flex-direction:column;min-width:0;flex:none;max-width:42%}
.bd-pl .who small{font-size:10px;color:var(--h-mute);font-weight:700}
.bd-pl.now .who small{color:var(--h-acc-d)}
.bd-pl .who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-sw{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.bd-sw.b{background:#141414}.bd-sw.w{background:#fff;border:1px solid #c9c6be}
.bd-cnt{margin-left:auto;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.bd-caps{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 1px;font-size:16px;line-height:1.1;min-width:0}
.bd-hands{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;min-width:0}
/* 盤 */
.bd-stage{flex:1 1 auto!important;min-height:120px;display:grid;place-items:center;overflow:hidden}
/* 3Dの盤：場所いっぱい（大きさは盤のほうで合わせる。並べ方に影響しないよう重ねて置く） */
.bd-stage.is3d{position:relative;border-radius:14px;background:#2a1e16}
.bd-3d{position:absolute;inset:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.bd-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);width:100%;aspect-ratio:1;--cell:40px;user-select:none;-webkit-user-select:none}
.bd-c{position:relative;border:0;padding:0;margin:0;background:none;display:grid;place-items:center;min-width:0;min-height:0}
.bd-c.last{background-color:rgba(255,90,54,.22)}
.bd-c.sel{box-shadow:inset 0 0 0 3px var(--h-acc)}
.bd-c.dot::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(20,20,20,.28);position:absolute}
.bd-c.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:3px solid rgba(255,90,54,.75)}
.bd-c.chk{background-image:radial-gradient(circle,rgba(255,60,30,.75),rgba(255,60,30,0) 70%)}
/* リバーシ */
.bd-g-reversi{background:#2f8a62;border:3px solid #1f5c41;border-radius:8px;gap:1px;padding:1px;background-clip:padding-box;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.bd-g-reversi .bd-c{background:#3a9a6f}
.bd-g-reversi .bd-c.last{background:#4fb085}
.bd-g-reversi .bd-c.dot::after{background:rgba(255,255,255,.45)}
.disc{width:80%;height:80%;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.disc.b{background:radial-gradient(circle at 35% 30%,#555,#111 60%)}
.disc.w{background:radial-gradient(circle at 35% 30%,#fff,#ddd 70%)}
.disc.flip{animation:bd-flip .35s ease}
@keyframes bd-flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
/* チェス */
.bd-g-chess{border-radius:6px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.bd-g-chess .lt{background-color:#f1e4cc}.bd-g-chess .dk{background-color:#c49a6c}
.cp{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2","DejaVu Sans",serif;line-height:1}
.bd-grid .cp{font-size:calc(var(--cell) * .8)}
.cp.w{color:#fff;-webkit-text-stroke:1.2px #141414;paint-order:stroke fill;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.cp.b{color:#141414;text-shadow:0 1px 0 rgba(255,255,255,.25)}
/* 将棋 */
.bd-g-shogi{background:#e8c98a;border:3px solid #a8814a;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.bd-g-shogi .bd-c{border-right:1px solid rgba(90,60,20,.55);border-bottom:1px solid rgba(90,60,20,.55)}
.bd-g-shogi .bd-c:nth-child(9n){border-right:0}
.bd-g-shogi .bd-c:nth-last-child(-n+9){border-bottom:0}
.koma{display:grid;place-items:center;background:#fff3dc;clip-path:polygon(50% 0,88% 18%,100% 100%,0 100%,12% 18%);color:#141414;font-weight:900;font-family:"Zen Kaku Gothic New","Hiragino Mincho ProN","Yu Mincho",serif;box-sizing:border-box}
.koma i{font-style:normal;line-height:1}
.koma.pro{color:#c23d1f}
.koma.opp{transform:rotate(180deg)}
.bd-grid .koma{width:82%;height:90%;padding-top:10%;font-size:calc(var(--cell) * .5)}
.bd-hand{position:relative;width:28px;height:32px;border:0;padding:4px 0 0;font-size:15px}
.bd-hand.sel{background:var(--h-acc);color:#fff}
.bd-hand em{position:absolute;right:-1px;bottom:-1px;font-style:normal;font-size:10px;background:var(--h-ink);color:#fff;border-radius:6px;padding:0 3px;line-height:1.4}
.bd-hand.opp em{transform:rotate(180deg)}
.bd-sw.koma{width:22px;height:24px;border-radius:0;box-shadow:none;font-size:11px;padding-top:3px;background:#141414;color:#fff}
.bd-sw.koma.gote{background:#fff;color:#141414;outline:1px solid #c9c6be}
/* 下の段 */
.bd-foot{display:flex;align-items:center;gap:10px;min-height:44px}
.bd-foot.col{flex-direction:column;align-items:stretch;gap:6px}
.bd-foot.col .pill{align-self:center}
.bd-info{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:13px;font-weight:700}
.bd-foot.col .bd-info{justify-content:center;text-align:center}
.bd-chk{background:var(--h-acc);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px}
.hub-go:disabled{opacity:.35;box-shadow:none}
.hub-meta.ng{color:var(--h-acc-d);font-weight:700}
/* 結果・ダイアログ */
.bd-over{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(246,245,242,.72);padding:16px 0;backdrop-filter:blur(2px)}
.bd-card{width:100%;max-width:340px;background:var(--h-card,#fff);color:#141414;border:1px solid var(--h-line,#e4e2dc);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.18);max-height:100%;overflow:auto}

<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ===== ドワーフ：深掘りチキンレース ENGINE (pure; no DOM) ===== */
const EXPEDITIONS = 5;
const LIMIT_MS = 45000;
const NPC = 'npc';
const cur = g => g.phase; // 互換用（使わない）
const clone = g => JSON.parse(JSON.stringify(g));

// 深さごとのマグマ率（熱さメーター）と、鉱石の量
const magmaRate = depth => Math.min(0.6, 0.04 * depth);
function oreAt(depth, rnd) { return Math.max(1, Math.round((2 + depth * 1.5) * (0.6 + rnd() * 0.8))); }
// 大鉱脈（鉱石3倍）の出やすさ：探検を重ねるほど上がる
const JACKPOT = [0.04, 0.07, 0.11, 0.16, 0.24];
const jackpotRate = exp => JACKPOT[Math.min(JACKPOT.length, Math.max(1, exp)) - 1];
// 次に掘る段の結果を前もって決めておく（レーダーで見るため）
function planNext(g, rnd) {
  const d = g.depth + 1;
  const fork = d >= 3 && !g.forkAt && rnd() < 0.22 ? true : (g.forkAt === d);
  const one = () => { const jp = rnd() < jackpotRate(g.exp); return { magma: rnd() < magmaRate(d), ore: oreAt(d, rnd) * (jp ? 3 : 1), jackpot: jp }; };
  g.next = fork ? { fork: true, left: one(), right: one() } : { fork: false, main: one() };
  if (fork) g.forkAt = d;
}
function addLog(g, text) { g.log = (g.log || []).concat(text).slice(-6); }

function newGame(humans, rnd = Math.random, now = Date.now()) {
  const players = humans.slice(0, 4); if (players.length < 2) players.push(NPC);
  const g = { v: 6, status: 'playing', players, bank: {}, radar: {}, gone: {}, exp: 0, log: [], history: [], startedAt: now };
  players.forEach(id => { g.bank[id] = 0; g.radar[id] = 1; });
  return startExpedition(g, rnd, now);
}
function startExpedition(g, rnd, now) {
  g.exp++; g.depth = 0; g.pot = 0; g.forkAt = 0; g.phase = 'choose'; g.lastAt = now;
  g.inside = g.players.filter(id => !g.gone[id]);
  g.bag = {}; g.inside.forEach(id => g.bag[id] = 0);
  g.choice = {}; g.radarSeen = {}; g.reveal = null; g.out = {};
  planNext(g, rnd);
  addLog(g, `${g.exp}回目の探検に出発！`);
  return g;
}
const needChoice = g => g.inside.filter(id => !g.gone[id]);
const allChosen = g => needChoice(g).every(id => g.choice[id]);
const options = g => g.next.fork ? ['left', 'right', 'back'] : ['go', 'back'];

function act(g0, id, a, rnd = Math.random, now = Date.now()) {
  if (g0.status !== 'playing') throw new Error('ゲームは終わっています');
  const g = clone(g0);
  if (a.t === 'next') { if (g.phase !== 'summary') throw new Error('まだ探検中です'); return g.exp >= EXPEDITIONS ? finish(g) : startExpedition(g, rnd, now); }
  if (a.t === 'timeout') {
    needChoice(g).forEach(p => { if (!g.choice[p]) { g.choice[p] = 'back'; g.gone[p] = true; addLog(g, '応答がない人は帰還扱いになった'); } });
    return resolve(g, rnd, now);
  }
  if (g.phase !== 'choose') throw new Error('今は選べません');
  if (!g.inside.includes(id)) throw new Error('坑道の中にいません');
  if (a.t === 'radar') {
    if (!g.radar[id]) throw new Error('レーダーはもう使いました');
    g.radar[id] = 0; g.radarSeen[id] = g.depth + 1;
    return g;
  }
  if (a.t === 'choose') {
    if (!options(g).includes(a.c)) throw new Error('その道は選べません');
    g.choice[id] = a.c; g.lastAt = now;
    return g;
  }
  throw new Error('知らない操作です');
}
// 全員の選択がそろったら一斉に公開して、掘る
function resolve(g, rnd = Math.random, now = Date.now()) {
  if (g.phase !== 'choose' || !allChosen(g)) return g;
  const picks = { ...g.choice }, leavers = g.inside.filter(p => picks[p] === 'back'), stay = g.inside.filter(p => picks[p] !== 'back');
  const rv = { depth: g.depth + 1, picks, leavers, fork: g.next.fork, sides: {}, potTaken: 0 };
  // 帰る人：リュックを換金し、床に残った鉱石を山分け
  if (leavers.length) {
    const share = Math.floor(g.pot / leavers.length); rv.potTaken = share;
    g.pot -= share * leavers.length;
    leavers.forEach(p => { g.bank[p] += g.bag[p] + share; g.out[p] = { result: 'home', got: g.bag[p] + share, depth: g.depth }; g.bag[p] = 0; });
  }
  g.inside = stay;
  if (!stay.length) { rv.end = 'allhome'; g.reveal = rv; return endExpedition(g, now); }
  g.depth++;
  const sides = g.next.fork ? { left: stay.filter(p => picks[p] === 'left'), right: stay.filter(p => picks[p] === 'right') } : { main: stay };
  for (const s in sides) {
    const who = sides[s]; if (!who.length) continue;
    const r = g.next[s];
    if (r.magma) {
      who.forEach(p => { g.out[p] = { result: 'magma', lost: g.bag[p], depth: g.depth }; g.bag[p] = 0; });
      g.inside = g.inside.filter(p => !who.includes(p));
      rv.sides[s] = { who, magma: true };
      addLog(g, `深さ${g.depth}でマグマ！ ${who.length}人が稼ぎを失った`);
    } else {
      const each = Math.floor(r.ore / who.length); who.forEach(p => g.bag[p] += each); g.pot += r.ore - each * who.length;
      rv.sides[s] = { who, magma: false, ore: r.ore, each, jackpot: !!r.jackpot };
      if (r.jackpot) addLog(g, `深さ${g.depth}で大鉱脈！ 鉱石${r.ore}個`);
    }
  }
  g.reveal = rv;
  g.choice = {}; g.radarSeen = {};
  if (!g.inside.length) { rv.end = 'magma'; return endExpedition(g, now); }
  g.lastAt = now;
  planNext(g, rnd);
  return g;
}
function endExpedition(g, now) {
  g.phase = 'summary'; g.lastAt = now; g.choice = {};
  g.history = (g.history || []).concat({ exp: g.exp, depth: g.depth, out: g.out });
  return g;
}
function finish(g) { g.status = 'over'; g.phase = 'over'; return g; }
const score = (g, id) => g.bank[id] || 0;

/* ---- ゴーレム（NPC）の考え方 ---- */
function npcChoice(g, rnd = Math.random) {
  const id = NPC, bag = g.bag[id] || 0, d = g.depth + 1, p = magmaRate(d);
  const n = Math.max(1, g.inside.length), gain = (2 + d * 1.5) / n;
  if (g.radarSeen[id] === d) {
    const danger = g.next.fork ? null : g.next.main.magma;
    if (danger === true) return { t: 'choose', c: 'back' };
    if (danger === false) return { t: 'choose', c: 'go' };
  }
  if (g.radar[id] && bag >= 8 && p > .15 && !g.next.fork) return { t: 'radar' };
  const risk = p * (bag + gain), reward = (1 - p) * gain;
  const back = bag > 0 && (risk > reward * 1.1 || (g.exp === EXPEDITIONS && bag >= 12 && rnd() < .5));
  if (back) return { t: 'choose', c: 'back' };
  if (g.next.fork) return { t: 'choose', c: rnd() < .5 ? 'left' : 'right' };
  return { t: 'choose', c: 'go' };
}
/* ===== END ENGINE ===== */

/* ===== トラッパー ENGINE (pure; no DOM) ===== */
const TR = {

/* ===== チェス ENGINE (pure; no DOM) ===== */

    LABEL: ['白', '黒'], side, kingAt,
    init() { const b = { bd: 'rnbqkbnrpppppppp' + '.'.repeat(32) + 'PPPPPPPPRNBQKBNR', cr: 'KQkq', ep: -1, hm: 0, turn: 0 }; return { bd: b.bd, cr: b.cr, ep: b.ep, hm: b.hm, hist: [key(b)] }; },

/* ===== 将棋 ENGINE (pure; no DOM) ===== */
// 盤は81文字（先手は大文字、後手は小文字、'.' 空き）。0番が後手側の左上（9一）、80番が先手側の右下（1九）。席0が先手

/* ===== ビンゴ大会 ENGINE (pure; no DOM) ===== */
// 部屋主が「回す係」（カードなし）。ほかの人は5×5のカード（まん中はフリー）。番号は1〜75（B 1-15 / I 16-30 / N 31-45 / G 46-60 / O 61-75）
