<title>ドワーフ 掘る演出の案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@500;700&display=swap">
<style>
/* 夜の坑道（ゲームと同じ色）。6つの案を同じ大きさのカードで並べ、それぞれ「せーの！→掘る→結果」をくり返す */
:root{
  color-scheme:dark;
  --bg:#15110e; --panel:#221b16; --seam:#3a3029; --ink:#efe4d4; --muted:#b3a493; --lamp:#f2a541; --lamp-d:#c47f22; --gold:#f2c84b; --ok:#7fd19b;
  --f-pix:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
  --f:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-pix);font-weight:400;font-size:28px;color:var(--lamp);margin:0;line-height:1.2;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:60ch}
.ctl{display:flex;gap:6px}
.ctl button{min-height:40px;border-radius:999px;border:1px solid var(--seam);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:0 14px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#2a1a08}
.ctl button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mk{background:var(--panel);border:1px solid var(--seam);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.chip{display:flex;align-items:center;justify-content:space-between;gap:6px;border:2px solid var(--seam);border-radius:10px;padding:3px 8px;font-size:11px;font-weight:700}
.chip:first-child{border-color:var(--lamp)}
.chip b{font-family:var(--f-pix);font-weight:400;font-size:17px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums;display:inline-block}
.chip small{font-size:12px;color:var(--ok);margin-left:2px}
.chip b.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.35)}}
.stage{position:relative;background:#1b2140;border-block:1px solid var(--seam);overflow:hidden}
.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.seeno{position:absolute;left:0;right:0;top:16%;text-align:center;font-family:var(--f-pix);font-size:34px;color:#fff1a8;text-shadow:3px 3px 0 var(--lamp-d),-2px -2px 0 #2a1a08;pointer-events:none;opacity:0}
.seeno.on{animation:seeno .9s ease forwards}
@keyframes seeno{0%{transform:scale(.5);opacity:0}20%{transform:scale(1.1);opacity:1}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.cap b{font-size:15px}
.cap b span{font-family:var(--f-pix);font-weight:400;color:var(--lamp);margin-right:6px}
.cap p{margin:0;font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:12px;border-top:1px dashed var(--seam);padding-top:12px}
@media (prefers-reduced-motion:reduce){.chip b.bump,.seeno.on{animation-duration:.01s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>せーの！のあとの「掘る」演出</h1>
      <p>どれも「せーの！」→ 掘る（約1.6秒）→ 1段深くなって上の数字に +3、をくり返しています。ゲームと同じ坑道の絵で描いています。</p>
    </div>
    <div class="ctl" role="group" aria-label="再生の速さ">
      <button id="sp1" aria-pressed="true">ふつう</button>
      <button id="sp2" aria-pressed="false">ゆっくり</button>
      <button id="sp0" aria-pressed="false">止める</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="note">組み合わせもできます（例：案1のツルハシ＋案6の鉱石が数字に飛ぶ）。マグマのときは、掘ったあとに今の「ドボン！」が出る想定です。</p>
</div>

<script>
/* ---- ゲームの坑道の絵（src/app.js と同じ） ---- */
// CW×VH：坑道のまわりだけ切り出して大きく見せる
const VW = 180, VH = 110, CW = 120, CX = 30, SX = 70, SW = 40, LV = 22, TOP = 40;
const HATS2 = ['#f2a541', '#6fb1e8', '#7fd19b', '#d98ad6'];
const magmaRate = depth => Math.min(0.6, 0.04 * depth);
function rng(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function sprite(c, x, y, i) {
  x = Math.round(x - 5); y = Math.round(y - 14);
  const R = (dx, dy, w, h, col) => { c.fillStyle = col; c.fillRect(x + dx, y + dy, w, h); };
  const hat = HATS2[i % 4];
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 1, y + 14, 8, 2);
  R(2, 0, 6, 1, hat); R(1, 1, 8, 2, hat); R(4, 0, 2, 1, '#fff6c8');
  R(1, 3, 8, 3, '#f6c49a'); R(3, 4, 1, 1, '#2a1d14'); R(6, 4, 1, 1, '#2a1d14'); R(4, 5, 2, 1, '#e88a72');
  R(1, 6, 8, 3, '#f4f1ea'); R(2, 9, 6, 1, '#f4f1ea'); R(1, 9, 1, 3, '#4a6ad0'); R(8, 9, 1, 3, '#3a54a8'); R(2, 10, 6, 2, '#4a6ad0'); R(3, 11, 4, 1, '#5a3a22');
  R(2, 12, 2, 1, '#4a3222'); R(6, 12, 2, 1, '#4a3222');
}
const scrollOf = depth => Math.max(0, TOP + depth * LV - Math.round(VH * 0.62));
function drawShaft(c, depth) {
  const scroll = scrollOf(depth);
  const sky = c.createLinearGradient(0, 0, 0, TOP); sky.addColorStop(0, '#1b2140'); sky.addColorStop(1, '#5a3a4a');
  c.fillStyle = sky; c.fillRect(0, 0, VW, TOP);
  c.fillStyle = '#ffe9a8'; [[14, 6], [40, 12], [96, 5], [128, 14], [170, 8], [60, 3]].forEach(([x, y]) => c.fillRect(x, y, 1, 1));
  c.fillStyle = '#fff6d0'; c.fillRect(151, 5, 3, 1); c.fillRect(150, 6, 5, 3); c.fillRect(151, 9, 3, 1);
  c.save(); c.translate(0, -scroll);
  const rows = Math.ceil((VH + scroll - TOP) / 8) + 2;
  for (let r = 0; r < rows; r++) {
    const y = TOP + r * 8, heat = Math.min(1, r * 8 / LV / 12);
    c.fillStyle = r < 2 ? '#7a5034' : `rgb(${110 + heat * 40 | 0},${92 - heat * 45 | 0},${80 - heat * 55 | 0})`; c.fillRect(0, y, VW, 8);
    const rr = rng(r * 97 + 13); for (let i = 0; i < 10; i++) { c.fillStyle = `rgba(0,0,0,${.12 + rr() * .1})`; c.fillRect(Math.floor(rr() * VW), y + Math.floor(rr() * 8), 1 + Math.floor(rr() * 2), 1); }
    if (r > 2 && rr() < .5) { const ores = ['#3a3436', '#e8843a', '#e6eef6', '#ffd23a', '#59e3ff']; c.fillStyle = ores[Math.floor(rr() * ores.length)]; const x = rr() < .5 ? Math.floor(rr() * 50) + 6 : Math.floor(rr() * 50) + 120; c.fillRect(x, y + 3, 2, 2); }
  }
  c.fillStyle = '#4f8a3a'; c.fillRect(0, TOP - 3, VW, 4); c.fillStyle = '#2f5a26'; c.fillRect(0, TOP + 1, VW, 1);
  for (let x = 2; x < VW; x += 7) { c.fillStyle = '#6aa84a'; c.fillRect(x, TOP - 4, 1, 1); }
  const bottom = TOP + depth * LV;
  c.fillStyle = '#1a120e'; c.fillRect(SX, TOP - 3, SW, bottom - TOP + 3);
  c.fillStyle = '#2a1e18'; c.fillRect(SX, TOP - 3, 3, bottom - TOP + 3); c.fillRect(SX + SW - 3, TOP - 3, 3, bottom - TOP + 3);
  for (let d = 1; d <= Math.floor(depth); d++) { const y = TOP + d * LV; c.fillStyle = '#3a2a20'; c.fillRect(SX, y - 2, SW, 2); c.fillStyle = 'rgba(242,165,65,.55)'; c.font = '6px monospace'; c.fillText(String(d), SX - 9, y - 6); }
  c.fillStyle = '#7a5a32'; for (let y = TOP - 2; y < bottom - 2; y += 4) c.fillRect(SX + SW - 9, y, 5, 1); c.fillRect(SX + SW - 9, TOP - 2, 1, bottom - TOP); c.fillRect(SX + SW - 5, TOP - 2, 1, bottom - TOP);
  const heat = magmaRate(depth + 1), mg = c.createLinearGradient(0, bottom + LV * 2, 0, bottom + LV * 5);
  mg.addColorStop(0, 'rgba(255,90,30,0)'); mg.addColorStop(1, `rgba(255,90,30,${Math.min(.95, heat * 1.8)})`); c.fillStyle = mg; c.fillRect(0, bottom + LV * 2, VW, LV * 3);
  const lg = c.createRadialGradient(SX + 21, bottom - 8, 2, SX + 21, bottom - 8, 44); lg.addColorStop(0, 'rgba(242,165,65,.5)'); lg.addColorStop(1, 'rgba(242,165,65,0)'); c.fillStyle = lg; c.fillRect(0, bottom - 60, VW, 110);
  return { bottom, scroll };
}

/* ---- 掘る演出 ---- */
const D0 = 2, GAIN = 3, L = 3800, SEENO = 900, DIG = 1600; // 1回のくり返し：せーの 0.9秒 → 掘る 1.6秒 → 結果
const ease = u => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);
const P = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
// ツルハシ：上げている／ふりおろした の2コマ
function pick(c, x, y, down) {
  x = Math.round(x); y = Math.round(y);
  if (!down) { P(c, x + 3, y - 12, 1, 6, '#8a5a32'); P(c, x + 1, y - 13, 6, 1, '#c9cdd6'); P(c, x + 1, y - 12, 1, 1, '#c9cdd6'); P(c, x + 6, y - 12, 1, 1, '#c9cdd6'); }
  else { P(c, x + 4, y - 6, 4, 1, '#8a5a32'); P(c, x + 7, y - 6, 1, 5, '#c9cdd6'); P(c, x + 6, y - 2, 1, 1, '#c9cdd6'); }
}
function chips(c, cx, y, u, seed, n = 8) { // 土のかけらが飛ぶ
  const r = rng(seed);
  for (let i = 0; i < n; i++) { const vx = (r() - .5) * 40, vy = -20 - r() * 25; P(c, cx + vx * u, y + vy * u + 60 * u * u, 1 + (r() < .3), 1, r() < .25 ? '#ffd23a' : '#8a6a4a'); }
}
const x0 = k => SX + 12 + k * 14;
const DIGS = [
  { n: 'ツルハシ3回', d: '2人そろってツルハシを3回ふる。カツンごとに土が飛び、3回目で床がぬけてストンと1段下へ。', f(c, u) {
    const fall = u > .82, depth = fall ? D0 + 1 : D0, s = drawShaft(c, depth); c.save(); c.translate(0, -s.scroll);
    const dy = fall ? -LV * (1 - ease((u - .82) / .18)) : 0, f = (u * 3.4) % 1, down = !fall && f > .5;
    [0, 1].forEach(k => { sprite(c, x0(k), s.bottom - 2 + dy, k); if (!fall) pick(c, x0(k), s.bottom - 2, down); });
    if (!fall && f > .5) chips(c, SX + SW / 2, s.bottom - 3, (f - .5) * 2, Math.floor(u * 3.4) * 7 + 3);
    c.restore(); } },
  { n: '土けむりポン', d: 'ポンッと土けむりが広がって、晴れると1段深くなっている。軽くてコミカル。', f(c, u) {
    const depth = u > .45 ? D0 + 1 : D0, s = drawShaft(c, depth); c.save(); c.translate(0, -s.scroll);
    const hop = u < .25 ? -Math.abs(Math.sin(u / .25 * Math.PI * 2)) * 4 : 0;
    [0, 1].forEach(k => sprite(c, x0(k), s.bottom - 2 + hop, k));
    if (u > .2) { const v = (u - .2) / .8, rad = 8 + ease(v * 1.6) * 22, a = v < .6 ? 1 : 1 - (v - .6) / .4, r = rng(11);
      for (let i = 0; i < 70; i++) { const ang = r() * Math.PI * 2, d = Math.sqrt(r()) * rad; P(c, SX + SW / 2 + Math.cos(ang) * d * 1.2, s.bottom - 8 + Math.sin(ang) * d * .7, 3, 3, `rgba(${170 + r() * 40 | 0},${150 + r() * 30 | 0},${130},${a * .9})`); } }
    c.restore(); } },
  { n: 'ガタガタ沈む', d: '画面が小きざみにゆれて、床ごとじわじわ下がる。壁から小石がこぼれる。重みがある。', f(c, u, cv) {
    const depth = D0 + ease(u * 1.1), s = drawShaft(c, depth); c.save(); c.translate(0, -s.scroll);
    cv.style.transform = u < .9 ? `translate(${(Math.random() - .5) * 2}px,${(Math.random() - .5) * 1.5}px)` : '';
    [0, 1].forEach(k => sprite(c, x0(k), s.bottom - 2, k));
    const r = rng(5); for (let i = 0; i < 6; i++) { const sx = r() < .5 ? SX + 3 : SX + SW - 4, t = (u * 2 + r()) % 1; P(c, sx + (sx < SX + 10 ? 1 : -1) * t * 4, s.bottom - LV - 10 + t * (LV + 8), 1, 1, '#9a7a5a'); }
    c.restore(); } },
  { n: 'ひび → パカッ', d: '床にひびが走ってパカッと割れ、みんなで落ちて着地。マグマのときのドキドキにつながる。', f(c, u) {
    const fall = u > .6, depth = fall ? D0 + 1 : D0, s = drawShaft(c, depth); c.save(); c.translate(0, -s.scroll);
    if (!fall) { const n = Math.floor(ease(u / .55) * 10); let x = SX + SW / 2, y = s.bottom - 1; for (let i = 0; i < n; i++) { P(c, x, y, 1, 1, '#f2c84b'); P(c, SX + SW - (x - SX), y, 1, 1, '#f2c84b'); x -= 1.7; y += (i % 2 ? 1 : -1); } }
    const dy = fall ? -LV * (1 - ease((u - .6) / .25)) : 0, squash = fall && u > .85 && u < .93;
    [0, 1].forEach(k => sprite(c, x0(k), s.bottom - 2 + dy + (squash ? 1 : 0), k));
    if (fall && u < .85) { const v = (u - .6) / .25, r = rng(9); for (let i = 0; i < 8; i++) P(c, SX + 4 + r() * (SW - 8), s.bottom - LV + 2 + v * v * 40 + r() * 4, 3, 2, '#5a4030'); }
    c.restore(); } },
  { n: 'じゅんばんに掘る', d: '1人ずつ前に出てツルハシ。掘るたびに鉱石がポンと飛び出す。誰が掘ったかわかりやすい。', f(c, u) {
    const sink = u > .78, depth = D0 + (sink ? ease((u - .78) / .2) : 0), s = drawShaft(c, depth); c.save(); c.translate(0, -s.scroll);
    const who = u < .39 ? 0 : 1, v = (u % .39) / .39;
    [0, 1].forEach(k => { const act = !sink && k === who; sprite(c, x0(k), s.bottom - 2 - (act && v < .15 ? 2 : 0), k); if (act) pick(c, x0(k), s.bottom - 2, (v * 2.5) % 1 > .5); });
    if (!sink && v > .55) { const t = (v - .55) / .45; P(c, x0(who) + 6, s.bottom - 6 - Math.sin(t * Math.PI) * 14, 2, 2, '#ffd23a'); }
    c.restore(); } },
  { n: '鉱石シャワー', d: 'ツルハシ1回で鉱石の粒が噴き出し、上の席の数字に吸いこまれていく。+3 の見せ方とセット。', f(c, u) {
    const depth = D0 + ease((u - .25) / .35), s = drawShaft(c, depth); c.save(); c.translate(0, -s.scroll);
    [0, 1].forEach(k => { sprite(c, x0(k), s.bottom - 2, k); if (u < .3) pick(c, x0(k), s.bottom - 2, u > .15); });
    if (u > .25) { const r = rng(21); for (let i = 0; i < 14; i++) { const t = Math.min(1, Math.max(0, (u - .25 - r() * .25) / .5)); if (t <= 0 || t >= 1) continue; const k = i % 2, tx = k ? 140 : 40;
      P(c, (SX + SW / 2) + (tx - SX - SW / 2) * t * t, s.bottom - 4 - (s.bottom - 4 + s.scroll + 8) * (1 - (1 - t) * (1 - t)) - Math.sin(t * Math.PI) * 10, 2, 2, ['#ffd23a', '#e6eef6', '#e8843a'][i % 3]); } }
    c.restore(); } },
];

/* ---- カードを並べて動かす ---- */
const grid = document.getElementById('grid'), cards = [];
DIGS.forEach((v, i) => {
  const cv = document.createElement('canvas'); cv.width = CW; cv.height = VH; cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', `案${i + 1}：${v.n}`);
  const el = document.createElement('div'); el.className = 'mk';
  el.innerHTML = `<div class="chips"><span class="chip">フミ <b>4</b></span><span class="chip">ハル <b>7</b></span></div><div class="stage"></div><div class="cap"><b><span>案${i + 1}</span>${v.n}</b><p>${v.d}</p></div>`;
  const seeno = document.createElement('div'); seeno.className = 'seeno'; seeno.textContent = 'せーの！';
  el.querySelector('.stage').append(cv, seeno); grid.append(el);
  cards.push({ v, cv, c: cv.getContext('2d'), seeno, sc: [...el.querySelectorAll('.chip b')], base: [4, 7], phase: -1 });
});
let speed = 1, clock = 0, last = performance.now();
[['sp1', 1], ['sp2', .4], ['sp0', 0]].forEach(([id, s]) => document.getElementById(id).addEventListener('click', e => {
  speed = s; document.querySelectorAll('.ctl button').forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget)));
}));
function frame(now) {
  clock += (now - last) * speed; last = now;
  const p = clock % L;
  cards.forEach(k => {
    const ph = p < SEENO ? 0 : p < SEENO + DIG ? 1 : 2;
    if (ph !== k.phase) {
      k.phase = ph;
      if (ph === 0) { k.seeno.classList.remove('on'); void k.seeno.offsetWidth; k.seeno.classList.add('on'); k.sc.forEach((b, j) => b.innerHTML = String(k.base[j])); }
      if (ph === 2) k.sc.forEach((b, j) => { b.innerHTML = `${k.base[j]}<small>(+${GAIN})</small>`; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); });
    }
    k.c.setTransform(1, 0, 0, 1, 0, 0); k.c.clearRect(0, 0, CW, VH); k.c.translate(-CX, 0); k.cv.style.transform = '';
    if (ph === 1) k.v.f(k.c, (p - SEENO) / DIG, k.cv);
    else { const s = drawShaft(k.c, ph === 2 ? D0 + 1 : D0); k.c.save(); k.c.translate(0, -s.scroll); [0, 1].forEach(j => sprite(k.c, x0(j), s.bottom - 2, j)); k.c.restore(); }
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
